# Перевірка кожного коміту і збирання версії для Linux.
#   test           — тести на Ubuntu і Windows (код має працювати на обох системах)
#   linux-package  — збирання dist/UWFix-<версія>-linux-x64.tar.gz і .deb, знімок вікна на віртуальному
#                    екрані (Xvfb); після публікації релізу файли додаються до нього
name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Тести (Linux)
        if: runner.os != 'Windows'
        run: ./mvnw -B test
      - name: Тести (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B test

  linux-package:
    needs: test
    # Старіша Ubuntu — щоб програма запускалась і на дистрибутивах зі старішою glibc
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Системні пакети
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot xvfb libgtk-3-0 libgl1
      - name: Збирання
        run: ./build-linux.sh --skip-tests --deb
      - name: Знімок вікна (Xvfb)
        continue-on-error: true
        run: |
          export UWFIX_HOME="$RUNNER_TEMP/uwfix-home"
          for lang in en uk; do
            timeout 120 xvfb-run -a -s "-screen 0 1600x1000x24" \
              dist/UWFix/bin/UWFix --demo --action=lang:$lang --snapshot="$PWD/dist/linux-$lang.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: uwfix-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.png
          if-no-files-found: warn
      - name: Додати до релізу
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tar.gz dist/*.deb --clobber
