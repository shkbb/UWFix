# ---------- Game sources and engines ----------
source.manual=Added manually
engine.unreal_4_5.name=Unreal Engine 4/5
engine.unreal_4_5.hint=Cutscenes with a constrained aspect ratio usually take 16:9 from the main .exe (*-Win64-Shipping.exe). The method often works.
engine.unreal_3.name=Unreal Engine 3
engine.unreal_3.hint=UE3 games keep 16:9 in the main .exe — replacing it usually removes the bars.
engine.unity_il2cpp.name=Unity (IL2CPP)
engine.unity_il2cpp.hint=In Unity games the bars are added by the game’s own code — it is compiled into GameAssembly.dll.
engine.unity_mono.name=Unity (Mono)
engine.unity_mono.hint=In Unity games the bars are added by the game’s own code — it lives in Assembly-CSharp.dll.
engine.red_engine.name=REDengine
engine.red_engine.hint=REDengine games (The Witcher 3, Cyberpunk 2077) keep 16:9 in the main .exe. For The Witcher 3 (next-gen) the community has verified this method.
engine.source_2.name=Source 2
engine.source_2.hint=Source 2 (Counter-Strike 2, Dota 2, Half-Life: Alyx) supports any aspect ratio by itself. Valve’s online games are protected by VAC — don’t modify their files.
engine.source.name=Source
engine.source.hint=Source (Half-Life 2, Portal 2, Left 4 Dead 2) usually supports wide screens by itself; you can set the resolution below, in the game settings.
engine.re_engine.name=RE Engine
engine.re_engine.hint=RE Engine (Resident Evil 2/3/4/7/Village, Monster Hunter, Devil May Cry 5): cutscene bars are added by the game code, so replacing 16:9 doesn’t always help. The community’s fuller fix is the REFramework mod.
engine.mt_framework.name=MT Framework
engine.mt_framework.hint=MT Framework (Resident Evil 5/6, Revelations, Dragon’s Dogma): 16:9 is often stored in the main .exe — the method may work.
engine.rage.name=RAGE
engine.rage.hint=RAGE (GTA V, Red Dead Redemption 2): Rockstar games support 21:9 in their settings. Don’t modify files if you play online.
engine.cryengine.name=CryEngine
engine.cryengine.hint=CryEngine: replacing 16:9 in the .exe or .dll may remove cutscene bars; the game takes its resolution from r_Width and r_Height.
engine.creation.name=Creation Engine
engine.creation.hint=Creation Engine / Gamebryo (Skyrim, Fallout): the resolution is stored in *Prefs.ini (iSize W / iSize H) — you can set it below.
engine.frostbite.name=Frostbite
engine.frostbite.hint=Frostbite (EA games): most support 21:9 in the menu; online games are protected by anti-cheat.
engine.gamemaker.name=GameMaker
engine.gamemaker.hint=GameMaker: 2D games with a fixed frame size — side bars are part of the design, this method usually won’t help.
engine.godot.name=Godot
engine.godot.hint=Godot: scaling is defined by the game itself; replacing 16:9 helps only in some games.
engine.unknown.name=Unknown
engine.unknown.hint=The engine could not be detected. You can still try: a backup is created before any change.

