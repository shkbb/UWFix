# ---------- Game sources and engines ----------
source.manual=Added manually
engine.unreal_4_5.name=Unreal Engine 4/5
engine.unreal_4_5.hint=Cutscenes with a constrained aspect ratio usually take 16:9 from the main .exe (*-Win64-Shipping.exe). The method often works.
engine.unreal_3.name=Unreal Engine 3
engine.unreal_3.hint=UE3 games keep 16:9 in the main .exe — replacing it usually removes the bars.
engine.unity_il2cpp.name=Unity (IL2CPP)
engine.unity_il2cpp.hint=In Unity games the bars are added by the game’s own code — it is compiled into GameAssembly.dll.
engine.unity_mono.name=Unity (Mono)
engine.unity_mono.hint=In Unity games the bars are added by the game’s own code — it lives in Assembly-CSharp.dll.
engine.red_engine.name=REDengine
engine.red_engine.hint=For The Witcher 3 (next-gen) the community has verified exactly this method — replacing 16:9 in witcher3.exe.
engine.unknown.name=Unknown
engine.unknown.hint=The engine could not be detected. You can still try: a backup is created before any change.

